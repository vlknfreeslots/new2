<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLKN: free slots</title>
  <style>
    body { font-family: 'Arial Black', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #0b0c10; color: white; margin: 0; padding: 20px; box-sizing: border-box; }
    .logo { color: #00d2ff; text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff; font-size: 2.5rem; margin-bottom: 5px; text-transform: uppercase; }
    .subtitle { color: #ff007f; font-size: 1.2rem; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; text-shadow: 0 0 8px #ff007f; }
    
    .dashboard { display: flex; gap: 20px; margin-bottom: 20px; align-items: center; }
    .panel-box { background: rgba(255, 255, 255, 0.05); padding: 10px 20px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
    .panel-label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; margin-bottom: 3px; font-family: Arial, sans-serif; }
    .balance-amount { color: #00ffcc; font-size: 1.4rem; font-weight: bold; text-shadow: 0 0 10px rgba(0, 255, 204, 0.4); }
    
    .bet-control { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
    .bet-btn { background: #1f2833; border: 1px solid #00d2ff; color: #00d2ff; font-weight: bold; font-size: 1.2rem; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .bet-btn:hover { background: #00d2ff; color: #1f2833; }
    .bet-amount { font-size: 1.3rem; min-width: 60px; font-weight: bold; text-align: center; }

    /* Сетка 3x3 для слот-машины */
    .slot-machine { display: grid; grid-template-columns: repeat(3, 85px); grid-template-rows: repeat(3, 85px); border: 4px solid #00d2ff; border-radius: 15px; background: #1f2833; padding: 25px; gap: 15px; margin-bottom: 25px; box-shadow: 0 0 25px rgba(0, 210, 255, 0.4); }
    .reel { border: 2px solid #45f3ff; border-radius: 10px; background: #fff; color: #000; font-size: 3.2rem; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 15px rgba(0,0,0,0.6); user-select: none; }
    
    .spin-btn { padding: 15px 50px; font-size: 1.4rem; background: linear-gradient(45deg, #ff007f, #ff00ff); border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 15px #ff007f; transition: 0.2s; }
    .spin-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 0 25px #ff00ff; }
    .spin-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
    
    #message { font-size: 1.1rem; min-height: 5rem; color: #00ffcc; font-weight: bold; text-align: center; margin-top: 10px; line-height: 1.4; text-shadow: 0 0 10px rgba(0,255,204,0.5); }

    .paytable { margin-top: 10px; background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 10px; border: 1px solid #1f2833; font-family: Arial, sans-serif; font-size: 0.9rem; max-width: 400px; width: 100%; }
    .paytable-title { color: #ff007f; text-align: center; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; font-family: 'Arial Black', sans-serif; }
    .paytable-row { display: flex; justify-content: space-between; margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .paytable-row:last-child { border-bottom: none; }
    .multiplier { color: #ffaa00; font-weight: bold; }
  </style>
</head>
<body>

  <div class="logo">VLKN</div>
  <div class="subtitle">free slots</div>

  <div class="dashboard">
    <div class="panel-box">
      <div class="panel-label">Баланс</div>
      <div id="balance" class="balance-amount">10000</div>
    </div>
    <div class="panel-box">
      <div class="panel-label">Линия / Всего (5 линий)</div>
      <div class="bet-control">
        <button class="bet-btn" onclick="adjustBet(-10)">-</button>
        <span id="betDisplay" class="bet-amount">20 / 100</span>
        <button class="bet-btn" onclick="adjustBet(10)">+</button>
      </div>
    </div>
  </div>

  <!-- Поле 3х3 -->
  <div class="slot-machine">
    <div class="reel" id="r0c0">👑</div><div class="reel" id="r0c1">💎</div><div class="reel" id="r0c2">👑</div>
    <div class="reel" id="r1c0">💎</div><div class="reel" id="r1c1">👑</div><div class="reel" id="r1c2">💎</div>
    <div class="reel" id="r2c0">👑</div><div class="reel" id="r2c1">💎</div><div class="reel" id="r2c2">👑</div>
  </div>

  <button id="spinBtn" class="spin-btn" onclick="spin()">Испытать удачу</button>
  <div id="message">Удачи! На поле спрятан WILD-символ 👑 Корона!</div>

  <div class="paytable">
    <div class="paytable-title">Выплаты (за 1 линию)</div>
    <div class="paytable-row"><span>👑 WILD Корона — заменяет всё!</span><span class="multiplier">Wild</span></div>
    <div class="paytable-row"><span>💎 💎 💎 (МЕГА ДЖЕКПОТ)</span><span class="multiplier">x50</span></div>
    <div class="paytable-row"><span>⭐ ⭐ ⭐ (СУПЕР ПРИЗ)</span><span class="multiplier">x20</span></div>
    <div class="paytable-row"><span>🍉 🍉 🍉 / 🍇 🍇 🍇</span><span class="multiplier">x10</span></div>
    <div class="paytable-row"><span>🍋 🍋 🍋 / 🍒 🍒 🍒</span><span class="multiplier">x5</span></div>
    <div class="paytable-row"><span>Любые 2 совпадения в линии</span><span class="multiplier">x1.5</span></div>
  </div>

  <script>
    // Добавлен WILD символ 👑 в массив барабанов
    const symbols = ['🍒', '🍋', '🍇', '🍉', '⭐', '💎', '👑'];
    let balance = 10000;
    let betPerLine = 20; 
    const maxBetPerLine = 200;
    const minBetPerLine = 10;
    let isSpinning = false;
    
    function getRandomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function updateDisplay() {
      const totalBet = betPerLine * 5;
      document.getElementById('balance').innerText = balance + " 🪙";
      document.getElementById('betDisplay').innerText = `${betPerLine} / ${totalBet}`;
    }

    function adjustBet(amount) {
      if (isSpinning) return;
      let newBet = betPerLine + amount;
      if (newBet >= minBetPerLine && newBet <= maxBetPerLine) {
        betPerLine = newBet;
        updateDisplay();
      }
    }

    function spin() {
      if (isSpinning) return;
      const totalBet = betPerLine * 5;
      
      if (balance < totalBet) {
        if (confirm("У вас недостаточно монет! Получить 10 000 бесплатно?")) {
          balance = 10000;
          updateDisplay();
          document.getElementById('message').innerText = "Баланс пополнен!";
          document.getElementById('message').style.color = "#00ffcc";
        }
        return;
      }

      balance -= totalBet;
      updateDisplay();
      
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('message').innerText = "Вращение барабанов...";
      document.getElementById('message').style.color = "#c9d1d9";
      document.getElementById('message').style.textShadow = "none";
      
      let count = 0;
      const matrix = [
        ['', '', ''],
        ['', '', ''],
        ['', '', '']
      ];

      const interval = setInterval(() => {
        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 3; col++) {
            matrix[row][col] = getRandomSymbol();
            document.getElementById(`r${row}c${col}`).innerText = matrix[row][col];
          }
        }
        
        count++;
        if (count > 12) { 
          clearInterval(interval);
          checkGridWin(matrix);
        }
      }, 90);
    }

    // Умная функция оценки линии с учётом Wild
    function evaluateLine(s1, s2, s3) {
      // 1. Проверка на чистый джекпот из 3 алмазов или 3 вайлдов
      if ((s1==='💎' || s1==='👑') && (s2==='💎' || s2==='👑') && (s3==='💎' || s3==='👑')) {
        return { type: 'combo', mult: 50, sym: '💎' };
      }
      
      // Находим все уникальные обычные символы (исключая Wild)
      const regularSymbols = [s1, s2, s3].filter(s => s !== '👑');
      
      // Если все три символа были Wild (Короны) — даем топ-выплату
      if (regularSymbols.length === 0) {
        return { type: 'combo', mult: 50, sym: '👑' };
      }

      // Берём первый попавшийся обычный символ за целевой
      const target = regularSymbols[0];

      // Проверяем, подходят ли все три ячейки под целевой символ (с учётом замен Wild)
      const match1 = (s1 === target || s1 === '👑');
      const match2 = (s2 === target || s2 === '👑');
      const match3 = (s3 === target || s3 === '👑');

      if (match1 && match2 && match3) {
        let multiplier = 5;
        if (target === '⭐') multiplier = 20;
        else if (target === '🍉' || target === '🍇') multiplier = 10;
        return { type: 'combo', mult: multiplier, sym: target };
      }

      // Проверка на пары (любые 2 совпадения из 3, где Wild всегда помогает)
      if ((s1===s2 || s1==='👑' || s2==='👑') && s1!=='' && s2!=='') return { type: 'pair', mult: 1.5 };
      if ((s2===s3 || s2==='👑' || s3==='👑') && s2!=='' && s3!=='') return { type: 'pair', mult: 1.5 };
      if ((s1===s3 || s1==='👑' || s3==='👑') && s1!=='' && s3!=='') return { type: 'pair', mult: 1.5 };

      return { type: 'none', mult: 0 };
    }

    function checkGridWin(matrix) {
      isSpinning = false;
      document.getElementById('spinBtn').disabled = false;
      const msg = document.getElementById('message');

      let totalWin = 0;
      let winningLinesText = [];

      const lines = [
        { name: "Горизонталь 1", cells: [[0,0], [0,1], [0,2]] },
        { name: "Горизонталь 2", cells: [[1,0], [1,1], [1,2]] },
        { name: "Горизонталь 3", cells: [[2,0], [2,1], [2,2]] },
        { name: "Диагональ ➘",  cells: [[0,0], [1,1], [2,2]] },
