<!-- 1. HTML-структура заставки VLKN -->
<div id="site-preloader" class="preloader">
  <div class="preloader-content">
    <!-- Тематический анимированный элемент -->
    <div class="diamond-loader">💎</div>
    <h1 class="preloader-title">VLKN</h1>
    <p class="preloader-subtitle">FREE SLOTS</p>
    <p class="preloader-text">Загрузка слотов... <span id="preloader-timer">5</span> сек.</p>
  </div>
</div>

<!-- 2. CSS-стили заставки -->
<style>
  /* Фиксированный контейнер на весь экран с неоновым градиентом казино */
  .preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #1a0b2e 0%, #0a0314 100%); 
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    opacity: 1;
    transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
    visibility: visible;
    font-family: 'Arial Black', 'Arial', sans-serif;
  }

  .preloader-content {
    text-align: center;
    color: #ffffff;
  }

  /* Анимация пульсации и покачивания алмаза */
  .diamond-loader {
    font-size: 60px;
    margin-bottom: 15px;
    display: inline-block;
    animation: pulseAndTilt 1.5s ease-in-out infinite;
    filter: drop-shadow(0 0 15px #00ffcc); /* Свечение алмаза */
  }

  /* Стилизация заголовков под бренд VLKN */
  .preloader-title {
    font-size: 42px;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 4px;
    background: linear-gradient(45deg, #ff007f, #7f00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(127, 0, 255, 0.5);
  }

  .preloader-subtitle {
    font-size: 14px;
    margin: 5px 0 25px 0;
    color: #00ffcc;
    text-transform: uppercase;
    letter-spacing: 6px;
    text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
  }

  .preloader-text {
    font-size: 16px;
    font-family: 'Arial', sans-serif;
    color: #a5a1b8;
    margin: 0;
  }

  #preloader-timer {
    color: #fff;
    font-weight: bold;
    font-size: 18px;
  }

  /* Эффект плавного исчезновения */
  .preloader--hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* Описание анимации алмаза */
  @keyframes pulseAndTilt {
    0% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.2) rotate(15deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
</style>

<!-- 3. JavaScript-логика таймера -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const preloader = document.getElementById("site-preloader");
    const timerDisplay = document.getElementById("preloader-timer");
    let timeLeft = 5; // Время принудительного ожидания в секундах

    const countdown = setInterval(function() {
      timeLeft--;
      if (timeLeft >= 0) {
        timerDisplay.textContent = timeLeft;
      }
      
      if (timeLeft <= 0) {
        clearInterval(countdown);
        preloader.classList.add("preloader--hidden");
      }
    }, 1000);
  });
</script>
