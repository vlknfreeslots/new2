<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLKN: free slots</title>
  <style>
    /* НЕУБИВАЕМАЯ ЗАСТАВКА НА ЧИСТОМ CSS (БЕЗ JAVASCRIPT) */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0c10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      
      /* Анимация: ждем 3 секунды, затем 0.5 секунды плавно исчезаем */
      animation: fadeOutOnly 0.5s ease 3s forwards;
      /* Отключаем перехват кликов мыши сразу после исчезновения заставки */
      pointer-events: none; 
    }
    
    @keyframes fadeOutOnly {
      0% {
        opacity: 1;
        visibility: visible;
      }
      99% {
        opacity: 0;
        visibility: visible;
      }
      100% {
        opacity: 0;
        visibility: hidden; /* Полностью прячем заставку от кликов */
      }
    }

    .loader-logo {
      color: #00d2ff;
      text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
      font-size: 3.5rem;
      font-family: 'Arial Black', sans-serif;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 210, 255, 0.1);
      border-radius: 50%;
      border-top-color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ОСНОВНЫЕ СТИЛИ ИГРЫ */
    body { font-family: 'Arial Black', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #0b0c10; color: white; margin: 0; padding: 20px; box-sizing: border-box; }
    .logo { color: #00d2ff; text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff; font-size: 2.5rem; margin-bottom: 5px; text-transform: uppercase; }
    .subtitle { color: #ff007f; font-size: 1.2rem; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; text-shadow: 0 0 8px #ff007f; }
    
    .dashboard { display: flex; gap: 20px; margin-bottom: 20px; align-items: center; }
    .panel-box { background: rgba(255, 255, 255, 0.05); padding: 10px 20px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
    .panel-label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; margin-bottom: 3px; font-family: Arial, sans-serif; }
    .balance-amount { color: #00ffcc; font-size: 1.4rem; font-weight: bold; text-shadow: 0 0 10px rgba(0, 255, 204, 0.4); }
    
    .bet-control { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
    .bet-btn { background: #1f2833; border: 1px solid #00d2ff; color: #00d2ff; font-weight: bold; font-size: 1.2rem; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .bet-btn:hover { background: #00d2ff; color: #1f2833; }
    .bet-amount { font-size: 1.3rem; min-width: 50px; font-weight: bold; }

    .slot-machine { display: flex; border: 4px solid #00d2ff; border-radius: 15px; background: #1f2833; padding: 25px; gap: 15px; margin-bottom: 25px; box-shadow: 0 0 25px rgba(0, 210, 255, 0.4); }
    .reel { width: 85px; height: 85px; border: 2px solid #45f3ff; border-radius: 10px; background: #fff; color: #000; font-size: 3.2rem; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 15px rgba(0,0,0,0.6); }
    
    .spin-btn { padding: 15px 50px; font-size: 1.4rem; background: linear-gradient(45deg, #ff007f, #ff00ff); border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 15px #ff007f; transition: 0.2s; }
    .spin-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 0 25px #ff00ff; }
    .spin-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
    
    #message { font-size: 1.5rem; height: 2rem; color: #00ffcc; font-weight: bold; text-align: center; margin-top: 20px; text-shadow: 0 0 10px rgba(0,255,204,0.5); }

    .paytable { margin-top: 30px; background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 10px; border: 1px solid #1f2833; font-family: Arial, sans-serif; font-size: 0.9rem; max-width: 400px; width: 100%; }
    .paytable-title { color: #ff007f; text-align: center; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; font-family: 'Arial Black', sans-serif; }
    .paytable-row { display: flex; justify-content: space-between; margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .paytable-row:last-child { border-bottom: none; }
    .multiplier { color: #ffaa00; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Экран предзагрузки -->
  <div id="loader">
    <div class="loader-logo">VLKN</div>
    <div class="spinner"></div>
  </div>

  <!-- Основной контент игры -->
  <div class="logo">VLKN</div>
  <div class="subtitle">free slots</div>

  <div class="dashboard">
    <div class="panel-box">
      <div class="panel-label">Баланс</div>
      <div id="balance" class="balance-amount">10000 🪙</div>
    </div>
    <div class="panel-box">
      <div class="panel-label">Ставка</div>
      <div class="bet-control">
        <button class="bet-btn" onclick="adjustBet(-100)">-</button>
        <span id="betDisplay" class="bet-amount">100</span>
        <button class="bet-btn" onclick="adjustBet(100)">+</button>
      </div>
    </div>
  </div>

  <div class="slot-machine">
    <div class="reel" id="reel1">💎</div>
    <div class="reel" id="reel2">💎</div>
    <div class="reel" id="reel3">💎</div>
  </div>

  <button id="spinBtn" class="spin-btn" onclick="spin()">Испытать удачу</button>
  <p id="message"></p>

  <div class="paytable">
    <div class="paytable-title">Таблица выплат</div>
    <div class="paytable-row"><span>💎 💎 💎 (МЕГА ДЖЕКПОТ)</span><span class="multiplier">x50</span></div>
    <div class="paytable-row"><span>⭐ ⭐ ⭐ (СУПЕР ПРИЗ)</span><span class="multiplier">x20</span></div>
    <div class="paytable-row"><span>🍉 🍉 🍉 / 🍇 🍇 🍇</span><span class="multiplier">x10</span></div>
    <div class="paytable-row"><span>🍋 🍋 🍋 / 🍒 🍒 🍒</span><span class="multiplier">x5</span></div>
    <div class="paytable-row"><span>Любые 2 совпадения</span><span class="multiplier">x1.5</span></div>
  </div>

  <script>
    const symbols = ['🍒', '🍋', '🍇', '🍉', '⭐', '💎'];
    let balance = 10000;
    let currentBet = 100;
    const maxBet = 500;
    const minBet = 100;
    let isSpinning = false;
    
    // Прямая моментальная инициализация цифр без оберток
    document.getElementById('balance').innerText = balance + " 🪙";
    document.getElementById('betDisplay').innerText = currentBet;

    function getRandomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function updateDisplay() {
      var balanceEl = document.getElementById('balance');
      var betEl = document.getElementById('betDisplay');
      if (balanceEl) balanceEl.innerText = balance + " 🪙";
      if (betEl) betEl.innerText = currentBet;
    }

    function adjustBet(amount) {
      if (isSpinning) return;
      let newBet = currentBet + amount;
      if (newBet >= minBet && newBet <= maxBet) {
        currentBet = newBet;
        updateDisplay();
      }
    }

    function spin() {
      if (isSpinning) return;
      
      if (balance < currentBet) {
        if (confirm("У вас недостаточно монет для этой ставки! Получить 10 000 бесплатно?")) {
          balance = 10000;
          updateDisplay();
          var msg = document.getElementById('message');
          if (msg) {
            msg.innerText = "Баланс пополнен!";
            msg.style.color = "#00ffcc";
          }
        }
        return;
      }

      balance -= currentBet;
      updateDisplay();
      
      isSpinning = true;
      var spinBtn = document.getElementById('spinBtn');
      var msg = document.getElementById('message');
      
      if (spinBtn) spinBtn.disabled = true;
      if (msg) {
        msg.innerText = "Вращение...";
        msg.style.color = "#c9d1d9";
        msg.style.textShadow = "none";
      }
      
      let count = 0;
      const interval = setInterval(() => {
        const s1 = getRandomSymbol();
        const s2 = getRandomSymbol();
        const s3 = getRandomSymbol();
        
        var r1 = document.getElementById('reel1');
        var r2 = document.getElementById('reel2');
        var r3 = document.getElementById('reel3');
        
        if (r1) r1.innerText = s1;
        if (r2) r2.innerText = s2;
        if (r3) r3.innerText = s3;
        
        count++;
        if (count > 12) { 
          clearInterval(interval);
          checkWin(s1, s2, s3);
        }
      }, 90);
    }

    function checkWin(s1, s2, s3) {
      var msg = document.getElementById('message');
      var spinBtn = document.getElementById('spinBtn');
      
      isSpinning = false;
      if (spinBtn) spinBtn.disabled = false;

      let winAmount = 0;

      if (s1 === s2 && s2 === s3) {
        let multiplier = 5; 
        if (s1 === '💎') multiplier = 50;
        else if (s1 === '⭐') multiplier = 20;
        else if (s1 === '🍉' || s1 === '🍇') multiplier = 10;

        winAmount = currentBet * multiplier;
        balance += winAmount;

        if (msg) {
          if (s1 === '💎') {
            msg.innerText = `🎰 МЕГА ДЖЕКПОТ! +${winAmount} 🪙`;
            msg.style.color = "#00ffcc";
            msg.style.textShadow = "0 0 20px #00ffcc, 0 0 30px #ff00ff";
          } else {
            msg.innerText = `🎉 КОМБО! +${winAmount} 🪙`;
            msg.style.color = "#ffaa00";
            msg.style.textShadow = "0 0 15px #ffaa00";
          }
        }
