<!DOCTYPE html>
<html lang="ru" style="background-color: #0c0517 !important;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLKN</title>

  <style>
    /* БЛОКИРОВКА БЕЛОГО ЭКРАНА: Жестко задаем темный фон казино */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-color: #0c0517 !important; 
      overflow: hidden !important;
    }

    /* ПОЛНОЭКРАННЫЙ КОНТЕЙНЕР ЗАСТАВКИ */
    .wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a0b2e 0%, #0c0517 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      z-index: 999999;
    }

    /* Блок логотипа и индикатора */
    .brand-box {
      text-align: center;
      color: #ffffff;
      width: 100%;
      max-width: 320px;
      padding: 20px;
      box-sizing: border-box;
    }

    .title {
      font-size: 54px;
      font-weight: 900;
      margin: 0;
      letter-spacing: 4px;
      background: linear-gradient(45deg, #ff007f, #7f00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      margin: 5px 0 40px 0;
      color: #00ffcc;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* Трек индикатора загрузки */
    .progress-container {
      width: 100%;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    /* Заполняющаяся неоновая линия */
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7f00ff, #ff007f);
      border-radius: 10px;
      box-shadow: 0 0 10px #ff007f;
      animation: fillProgress 5s linear forwards; 
    }

    /* Анимация заполнения линии ровно за 5 секунд */
    @keyframes fillProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="brand-box">
      <!-- Название бренда -->
      <h1 class="title">VLKN</h1>
      <p class="subtitle">FREE SLOTS</p>
      
      <!-- Индикатор загрузки -->
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Запуск таймера перенаправления после полной готовности интерфейса заставки
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        // Безопасный редирект на ваш сайт без сохранения заглушки в истории «Назад»
        window.location.replace("https://vlknfreeslots.github.io/new/");
      }, 5000); // Ожидание 5000 миллисекунд (5 секунд)
    });
  </script>

</body>
</html>
