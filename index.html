<!DOCTYPE html>
<html lang="ru" style="background: #0c0517 !important;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLKN</title>
  
  <!-- Запасной аппаратный редирект браузера на случай сбоя скриптов -->
  <meta http-equiv="refresh" content="5;url=https://vlknfreeslots.github.io/new/">

  <style>
    /* Жесткая блокировка белого цвета холста на всех уровнях рендеринга */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: #0c0517 !important;
      overflow: hidden !important;
    }

    /* Полноэкранный слой заставки */
    .wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0c0517;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      z-index: 999999;
    }

    .brand-box {
      text-align: center;
      color: #ffffff;
      width: 100%;
      max-width: 280px;
    }

    .title {
      font-size: 54px;
      font-weight: 900;
      margin: 0;
      letter-spacing: 4px;
      background: linear-gradient(45deg, #ff007f, #7f00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      margin: 5px 0 40px 0;
      color: #00ffcc;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* Линейный индикатор загрузки */
    .progress-container {
      width: 100%;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7f00ff, #ff007f);
      border-radius: 10px;
      box-shadow: 0 0 10px #ff007f;
      /* Анимация заполнения линии ровно на 5 секунд */
      animation: fillProgress 5s linear forwards; 
    }

    @keyframes fillProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<!-- Инлайн-стили в body моментально окрашивают экран в темный цвет до прочтения CSS выше -->
<body style="background: #0c0517 !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important;">

  <div class="wrapper">
    <div class="brand-box">
      <!-- Элементы вашего бренда -->
      <h1 class="title">VLKN</h1>
      <p class="subtitle">FREE SLOTS</p>
      
      <!-- Индикатор загрузки -->
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Мгновенный запуск таймера перехода на ваш сайт
    setTimeout(function() {
      window.location.replace("https://vlknfreeslots.github.io/new/");
    }, 5000); // 5000 миллисекунд = 5 секунд
  </script>

</body>
</html>
