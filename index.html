<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLKN: Загрузка слотов...</title>
  
  <!-- Запасной автоматический редирект: если JS сломается, HTML сам переведет на сайт через 5 секунд -->
  <meta http-equiv="refresh" content="5;url=https://github.io">

  <style>
    /* Гарантированный сброс всех отступов браузера */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-color: #0c0517 !important; /* На случай если стили не успели прогрузиться */
      overflow: hidden;
    }

    /* Главный контейнер на весь экран */
    .wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: #0c0517; /* Базовый цвет казино */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* Блок с текстом по центру */
    .brand-box {
      text-align: center;
      color: #ffffff;
    }

    .title {
      font-size: 50px;
      font-weight: 900;
      margin: 0;
      letter-spacing: 3px;
      color: #ff007f; /* Розовый неоновый цвет */
    }

    .subtitle {
      font-size: 16px;
      margin: 5px 0 30px 0;
      color: #00ffcc; /* Бирюзовый цвет */
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .info-text {
      font-size: 18px;
      color: #a5a1b8;
      margin-bottom: 25px;
    }

    /* Простая и надежная кнопка */
    .btn {
      display: inline-block;
      background-color: #7f00ff;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      padding: 12px 30px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="brand-box">
      <h1 class="title">VLKN</h1>
      <p class="subtitle">FREE SLOTS</p>
      
      <p class="info-text">
        Вход в игровой зал через <span id="seconds">5</span> сек...
      </p>
      
      <!-- Прямая ссылка для перехода -->
      <a href="https://github.io" class="btn">Войти сейчас</a>
    </div>
  </div>

  <script>
    // Простой скрипт отсчета секунд
    var count = 5;
    var timerElement = document.getElementById("seconds");

    var counter = setInterval(function() {
      count--;
      if (timerElement) {
        timerElement.textContent = count;
      }
      if (count <= 0) {
        clearInterval(counter);
        // Дублируем переход через JS на случай, если мета-тег не сработал
        window.location.replace("https://github.io");
      }
    }, 1000);
  </script>

</body>
</html>
